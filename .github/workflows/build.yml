name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Install export templates
        run: |
          TPL_DIR="/home/runner/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TPL_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d "$TPL_DIR"
          ls "$TPL_DIR" | head -5

      - name: Import project
        run: godot --headless --path . --import

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" "build/windows/BlockFallingBlast.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: BlockFallingBlast-windows
          path: build/windows/BlockFallingBlast.exe
          if-no-files-found: error
