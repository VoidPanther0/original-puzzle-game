name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:${{ env.GODOT_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --path . --import
      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" "build/windows/BlockFallingBlast.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: BlockFallingBlast-windows
          path: build/windows/BlockFallingBlast.exe
          if-no-files-found: error
