name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep these in sync with export_presets.cfg and android/build/config.gradle.
  GODOT_VERSION: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable
  ANDROID_BUILD_TOOLS: 36.1.0
  ANDROID_PLATFORM: android-36
  ANDROID_NDK: 29.0.14206865
  ANDROID_CMAKE: 3.10.2.4988404

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # Godot's official Linux build links against these. The ALSA package
          # was renamed to libasound2t64 on Ubuntu 24.04+.
          ALSA_PKG=libasound2
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            ALSA_PKG=libasound2t64
          fi
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dri libglu1-mesa libxi6 libxrandr2 libxcursor1 \
            libxinerama1 libx11-6 "$ALSA_PKG"

      - name: Install Godot
        run: |
          wget -q -O godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot-bin"
          chmod +x "$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project
        run: "$GODOT_BIN --headless --path . --import"

      - name: Run game tests
        run: "$GODOT_BIN --headless --path . -s tests/run_tests.gd"

      - name: Run UI tests
        run: "$GODOT_BIN --headless --path . res://tests/ui_tests.tscn"

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          ALSA_PKG=libasound2
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            ALSA_PKG=libasound2t64
          fi
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dri libglu1-mesa libxi6 libxrandr2 libxcursor1 \
            libxinerama1 libx11-6 "$ALSA_PKG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platforms;${ANDROID_PLATFORM}" \
            "cmake;${ANDROID_CMAKE}" \
            "ndk;${ANDROID_NDK}"

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${GODOT_TEMPLATE_VERSION}

      - name: Install Godot
        run: |
          wget -q -O godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot-bin"
          chmod +x "$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          # The cache above usually hits; this re-downloads only if it is missing.
          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            wget -q -O templates.tpz \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
            mkdir -p "$HOME/godot-templates"
            unzip -q templates.tpz -d "$HOME/godot-templates"
            cp -R "$HOME/godot-templates/templates/." "$TEMPLATE_DIR/"
          fi
          ls "$TEMPLATE_DIR"

      - name: Configure Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          # Godot reads the Java/Android SDK paths and the debug keystore from the
          # editor settings file; there is no JAVA_HOME fallback for the JDK.
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: "$GODOT_BIN --headless --path . --import"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${GODOT_TEMPLATE_VERSION}
          restore-keys: gradle-

      - name: Export debug APK
        run: |
          mkdir -p build/android
          # --install-android-build-template creates the git-ignored android/
          # folder that the "Use Gradle Build" preset builds from.
          "$GODOT_BIN" --headless --path . \
            --install-android-build-template \
            --export-debug "Android APK (debug)" \
            "build/android/OriginalPuzzle-debug.apk"

      - name: Verify APK
        run: |
          test -f build/android/OriginalPuzzle-debug.apk
          ls -lh build/android/OriginalPuzzle-debug.apk
          unzip -l build/android/OriginalPuzzle-debug.apk | grep -E "lib/arm64-v8a|classes.dex"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OriginalPuzzle-debug-apk
          path: build/android/OriginalPuzzle-debug.apk
          if-no-files-found: error
          retention-days: 14
